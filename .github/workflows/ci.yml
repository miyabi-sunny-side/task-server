name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - name: Install frontend dependencies
        run: npm --prefix client ci

      - name: Check frontend formatting
        run: npm --prefix client run format:check

      - name: Check Svelte
        run: npm --prefix client run check

      - name: Test frontend
        run: npm --prefix client test

      - name: Build frontend
        run: npm --prefix client run build

      - name: Lint design contract
        run: npm --prefix client run lint:design

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test migration and execution loop
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Test Rust
        run: cargo test --locked

      - name: Package the native image verifier
        shell: bash
        run: |
          set -euo pipefail
          binary=$(cargo test --locked --test ui_smoke --no-run --message-format=json | jq -er 'select(.reason == "compiler-artifact" and .target.name == "ui_smoke" and .profile.test) | .executable')
          mkdir -p target/smoke
          cp "$binary" target/smoke/ui-smoke

      - name: Upload the native image verifier
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke
          path: target/smoke/ui-smoke
          if-no-files-found: error
