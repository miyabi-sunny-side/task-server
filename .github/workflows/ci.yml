name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - name: Install frontend dependencies
        run: npm --prefix client ci

      - name: Check frontend formatting
        run: npm --prefix client run format:check

      - name: Check Svelte
        run: npm --prefix client run check

      - name: Test frontend
        run: npm --prefix client test

      - name: Build frontend
        run: npm --prefix client run build

      - name: Lint design contract
        run: npm --prefix client run lint:design

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test migration and execution loop
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Test Rust
        run: cargo test --locked

      - name: Smoke-test the standalone binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked
          smoke_dir=$(mktemp -d)
          cp target/debug/task-server "$smoke_dir/"
          (
            cd "$smoke_dir"
            exec ./task-server
          ) >"$smoke_dir/server.log" 2>&1 &
          server_pid=$!
          trap 'kill -INT "$server_pid" 2>/dev/null || true; wait "$server_pid" || true; rm -rf "$smoke_dir"' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null; then
              break
            fi
            if [[ "$attempt" == 40 ]]; then
              cat "$smoke_dir/server.log"
              exit 1
            fi
            sleep 0.5
          done
          python3 .github/smoke-ui.py http://127.0.0.1:3000
