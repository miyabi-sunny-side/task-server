name: Release container

on:
  # Manual runs must select a v-prefixed tag ref.
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` is what `gh release create` needs; the image push
      # still only needs `packages: write`.
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Resolve tagged commit's short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # CI on main already built and pushed this commit as `sha-<short>`. A
      # release is then only new names on that image (`<version>`, `latest`);
      # the full build below is the fallback for a commit CI never published.
      - name: Check for a CI-built image at this commit
        id: source
        run: |
          if docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:sha-${{ steps.sha.outputs.short }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retag the CI-built image
        if: steps.source.outputs.found == 'true'
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "${{ steps.meta.outputs.tags }}"
          docker buildx imagetools create "${args[@]}" \
            "ghcr.io/${{ github.repository }}:sha-${{ steps.sha.outputs.short }}"

      - name: Build and publish image
        if: steps.source.outputs.found == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # The GitHub Release is part of the release, not an extra: every product
      # publishes one for every tag, so a listener (version-server) can act on
      # it. A tag that already has a Release (a re-run of this workflow) is
      # left as it is rather than failed.
      - name: Resolve the published image digest
        id: digest
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}" \
            --format '{{ .Manifest.Digest }}')
          [ -n "$digest" ]
          echo "image=ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving it as it is"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --notes "Image: \`${{ steps.digest.outputs.image }}\`"
