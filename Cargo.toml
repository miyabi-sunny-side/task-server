[package]
name = "task-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[dependencies]
axum = "0.8.9"
fs2 = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
serde_norway = "0.9.42"
thiserror = "2.0.17"
time = { version = "0.3.41", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.16.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.19.1"
tower = { version = "0.5.3", features = ["util"] }

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = true
strip = true
codegen-units = 1
