[package]
name = "task-server"
version = "0.4.29"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[dependencies]
axum = "0.8.9"
include_dir = "0.7.4"
mime_guess = "2.0.5"
rmcp = { version = "3.1.2", features = ["server", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
serde_norway = "0.9.42"
thiserror = "2.0.17"
time = { version = "0.3.41", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.16.0", features = ["v4"] }

[dev-dependencies]
html5gum = { version = "0.8.4", default-features = false }
hyper = { version = "1.11.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
tempfile = "3.19.1"
tower = { version = "0.5.3", features = ["util"] }

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
# Keep Cargo's release defaults for this I/O-oriented service.
opt-level = 3
lto = false
strip = true
codegen-units = 16
